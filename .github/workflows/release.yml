name: Release

on:
  push:
    tags:
      - 'release-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="${tag#release-v}"
          if [[ "$tag" == "$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: src/go.sum
      - name: Test release source
        run: |
          go test ./...
          go vet ./...
      - name: Build release binaries
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          mkdir -p ../dist
          build() {
            target_os="$1"
            target_arch="$2"
            suffix="$3"
            gomips="${4:-}"
            if [ -n "$gomips" ]; then
              CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" GOMIPS="$gomips" \
                go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" \
                -o "../dist/njtechlogin-${suffix}" .
            else
              CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" \
                go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION}" \
                -o "../dist/njtechlogin-${suffix}" .
            fi
          }
          build linux amd64 linux-amd64
          build linux arm64 linux-arm64
          build linux 386 linux-386
          build linux mips linux-mips softfloat
          build linux mipsle linux-mipsle softfloat
          build darwin amd64 darwin-amd64
          build darwin arm64 darwin-arm64
          cd ../dist
          sha256sum njtechlogin-* > SHA256SUMS
      - name: Publish GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -eu
          release_args=(--generate-notes --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" ./* "${release_args[@]}"
